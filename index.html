<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ninzy Core — Baca Manga, Manhwa, Manhua</title>
<meta name="description" content="Ninzy Core: baca manga, manhwa, dan manhua dari MangaDex &amp; Komiku dalam satu tempat.">
<meta name="theme-color" content="#14120f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23b23a2e'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif'%3E忍%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314120f'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23b23a2e'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif'%3E忍%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="topbar__inner">
    <a href="#/home" class="brand">
      <span class="brand__seal">忍</span>
      <span class="brand__word">NINZY<em>CORE</em></span>
    </a>

    <form id="searchForm" class="search">
      <input id="searchInput" type="search" placeholder="Cari judul manga, manhwa, manhua…" autocomplete="off">
      <button type="submit" aria-label="Cari">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <nav class="topnav">
      <a href="#/home" data-route="home">Beranda</a>
      <a href="#/browse/mangadex" data-route="browse">Jelajah</a>
      <a href="#/library" data-route="library">Rak Saya</a>
      <a href="#/history" data-route="history">Riwayat</a>
    </nav>

    <div class="topbar__actions">
      <button id="randomBtn" class="chip" title="Komik acak">🎲 Acak</button>
      <button id="sourceToggleBtn" class="chip" title="Ganti sumber komik">
        <span id="sourceLabel">MangaDex</span>
      </button>
      <div id="authArea"></div>
      <button id="navToggle" class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <nav class="topnav topnav--mobile" id="mobileNav">
    <a href="#/home" data-route="home">Beranda</a>
    <a href="#/browse/mangadex" data-route="browse">Jelajah</a>
    <a href="#/library" data-route="library">Rak Saya</a>
    <a href="#/history" data-route="history">Riwayat</a>
    <button id="randomBtnMobile" class="chip" style="width:fit-content">🎲 Komik Acak</button>
  </nav>
</header>

<!-- ============ APP ROOT ============ -->
<main id="app"></main>

<!-- ============ AUTH MODAL ============ -->
<div id="authModal" class="modal-backdrop hidden">
  <div class="modal">
    <button class="modal__close" id="authModalClose">&times;</button>
    <div class="modal__seal">忍</div>
    <h2 id="authTitle">Masuk ke Ninzy Core</h2>
    <p class="modal__sub">Simpan bookmark &amp; riwayat baca ke akunmu.</p>

    <button id="googleSignInBtn" class="btn btn--google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.9 29.6 5 24 5c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.4 26.9 36 24 36c-5.3 0-9.6-3.3-11.2-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.6C41.5 36.6 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Lanjutkan dengan Google
    </button>

    <div class="divider"><span>atau</span></div>

    <form id="emailAuthForm">
      <input id="authEmail" type="email" placeholder="Email" required>
      <input id="authPassword" type="password" placeholder="Kata sandi" required minlength="6">
      <button type="submit" class="btn btn--primary" id="authSubmitBtn">Masuk</button>
    </form>
    <p class="modal__switch">
      <span id="authSwitchText">Belum punya akun?</span>
      <button id="authSwitchBtn" type="button">Daftar</button>
    </p>
    <p id="authError" class="modal__error hidden"></p>
  </div>
</div>

<!-- ============ SOURCE MODAL ============ -->
<div id="sourceModal" class="modal-backdrop hidden">
  <div class="modal">
    <button class="modal__close" id="sourceModalClose">&times;</button>
    <div class="modal__seal">源</div>
    <h2>Pilih Sumber</h2>
    <p class="modal__sub">Ninzy Core menggabungkan beberapa sumber komik.</p>
    <div class="source-list">
      <button class="source-item" data-source="mangadex">
        <span class="source-item__name">MangaDex</span>
        <span class="source-item__desc">API resmi, ribuan judul, scan bahasa Inggris/Indonesia. Aktif langsung, tanpa setup.</span>
        <span class="source-item__status ok">Siap pakai</span>
      </button>
      <button class="source-item" data-source="komiku">
        <span class="source-item__name">Komiku</span>
        <span class="source-item__desc">Komik bahasa Indonesia. Butuh proxy server (lihat README) karena Komiku tidak punya API publik.</span>
        <span class="source-item__status" data-status-for="komiku">Belum diatur</span>
      </button>
      <button class="source-item" data-source="shinigami">
        <span class="source-item__name">Shinigami</span>
        <span class="source-item__desc">Manhwa/manhua/manga bahasa Indonesia. Juga butuh proxy — domainnya sering berubah &amp; memakai Cloudflare, jadi lebih rawan gagal dibanding Komiku.</span>
        <span class="source-item__status" data-status-for="shinigami">Belum diatur</span>
      </button>
    </div>
    <div id="proxySetup" class="komiku-setup hidden">
      <label for="proxyUrlInput" id="proxySetupLabel">URL proxy kamu</label>
      <input id="proxyUrlInput" type="url" placeholder="https://proxy-kamu.example.com">
      <p id="proxyUrlWarning" class="modal__error hidden" style="text-align:left;margin-top:0;"></p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="proxySaveBtn" class="btn btn--primary btn--sm">Simpan</button>
        <button id="proxyUseSameOrigin" type="button" class="btn btn--ghost btn--sm">Pakai domain situs ini</button>
        <button id="proxyTestBtn" type="button" class="btn btn--ghost btn--sm">Tes koneksi</button>
      </div>
      <p id="proxyTestResult" class="hint"></p>
      <p class="hint" id="proxyHint"></p>
    </div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="toast hidden"></div>

<!-- ============ READER TOOLBAR TEMPLATE lives in app.js render ============ -->

<script type="module" src="app.js"></script>
</body>
</html>
